name: Publish release packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.1.0
        required: true
        type: string
      artifact_url:
        description: Short-lived download URL for the verified release artifact
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ARTIFACT_URL: ${{ inputs.artifact_url }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and validate packages
        shell: python
        run: |
          import os, re, urllib.request, urllib.parse, zipfile, io, pathlib, json, hashlib
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'v[0-9]+[.][0-9]+[.][0-9]+', version)
          url = urllib.parse.urlparse(os.environ['ARTIFACT_URL'])
          assert url.scheme == 'https' and (url.hostname.endswith('.blob.core.windows.net') or url.hostname.endswith('.githubusercontent.com'))
          expected = {'Fastighetsboken-win-Setup.exe','Fastighetsboken-win-Portable.zip','Fastighetsboken-'+version[1:]+'-full.nupkg','RELEASES','assets.win.json','releases.win.json','SHA256SUMS.json'}
          target = pathlib.Path('packages'); target.mkdir()
          with urllib.request.urlopen(url.geturl(), timeout=120) as response:
              data = response.read(200*1024*1024)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert set(archive.namelist()) == expected
              for name in expected:
                  (target/name).write_bytes(archive.read(name))
          checksums = json.loads((target/'SHA256SUMS.json').read_text())
          assert set(checksums) == expected - {'SHA256SUMS.json'}
          for name, digest in checksums.items():
              assert hashlib.sha256((target/name).read_bytes()).hexdigest() == digest
          feed = json.loads((target/'releases.win.json').read_text())
          assert all(a['Version'] == version[1:] and a['PackageId'] == 'Fastighetsboken' for a in feed['Assets'])
          (target/'SHA256SUMS.json').unlink()
      - name: Publish complete release
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_VERSION" packages/* --clobber
          gh release edit "$RELEASE_VERSION" --draft=false --latest
